name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview what Nx will release based on conventional commits)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/nx.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Nx Report
        run: npx nx report

      # Dry run - preview only (Nx determines version from conventional commits)
      - name: Preview Release (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: npx nx release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up stale release branch
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin --delete release 2>/dev/null || true
          git branch -D release 2>/dev/null || true

      - name: Create release branch
        if: ${{ inputs.dry_run == false }}
        run: git checkout -b release

      # Version, changelog, and commit (no tag — tagging happens after merge to master)
      - name: Version and Changelog
        if: ${{ inputs.dry_run == false }}
        run: npx nx release --skip-publish --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release branch
        if: ${{ inputs.dry_run == false }}
        run: git push -u origin release

      - name: Create PR to master
        if: ${{ inputs.dry_run == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 -oP '(?<=^## )\S+' CHANGELOG.md)

          gh pr create \
            --base master \
            --head release \
            --title "chore(release): v${VERSION}" \
            --body "$(cat <<EOF
          ## Release v${VERSION}

          This PR contains version bumps and changelog updates for the next release.

          **After merging**, the publish workflow will automatically:
          - Tag this commit as \`v${VERSION}\`
          - Create a GitHub Release
          - Publish packages to NPM

          ---
          *Auto-generated by the prepare release workflow*
          EOF
          )"
