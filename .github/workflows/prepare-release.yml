name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Release group to release (see release.groups in nx.json)'
        required: true
        default: platform
        type: choice
        options:
          - platform
      dry_run:
        description: 'Dry run (preview what Nx will release based on conventional commits)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.group }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/${{ inputs.group }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.6.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/nx.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Nx Report
        run: npx nx report

      # A group that has never been tagged needs --first-release
      - name: Release info (before)
        id: before
        run: bash tools/release/release-info.sh "${{ inputs.group }}" >> "$GITHUB_OUTPUT"

      # Dry run - preview only (Nx determines version from conventional commits)
      - name: Preview Release (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: >-
          npx nx release --dry-run --groups=${{ inputs.group }}
          ${{ steps.before.outputs.first_release == 'true' && '--first-release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up stale release branch
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin --delete "$RELEASE_BRANCH" 2>/dev/null || true
          git branch -D "$RELEASE_BRANCH" 2>/dev/null || true

      - name: Create release branch
        if: ${{ inputs.dry_run == false }}
        run: git checkout -b "$RELEASE_BRANCH"

      # Version, changelog, and commit (no tag — tagging happens after merge to master)
      - name: Version and Changelog
        if: ${{ inputs.dry_run == false }}
        run: >-
          npx nx release --skip-publish --groups=${{ inputs.group }}
          ${{ steps.before.outputs.first_release == 'true' && '--first-release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nx release can exit 0 without committing (nothing to release, or an unanswerable prompt in CI)
      - name: Check a release commit was made
        if: ${{ inputs.dry_run == false }}
        run: |
          if [ "$(git rev-list --count origin/master..HEAD)" = "0" ]; then
            echo "::error::nx release made no release commit. Check the Version and Changelog step output."
            exit 1
          fi

      - name: Push release branch
        if: ${{ inputs.dry_run == false }}
        run: git push -u origin "$RELEASE_BRANCH"

      - name: Release info (after)
        id: after
        if: ${{ inputs.dry_run == false }}
        run: bash tools/release/release-info.sh "${{ inputs.group }}" >> "$GITHUB_OUTPUT"

      - name: Create PR to master
        if: ${{ inputs.dry_run == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.after.outputs.tag }}"

          gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): ${TAG}" \
            --body "$(cat <<EOF
          ## Release ${TAG}

          This PR contains version bumps and changelog updates for the next \`${{ inputs.group }}\` release.

          **After merging**, the publish workflow will automatically:
          - Tag this commit as \`${TAG}\`
          - Create a GitHub Release
          - Publish the group's packages to NPM

          ---
          *Auto-generated by the prepare release workflow*
          EOF
          )"
