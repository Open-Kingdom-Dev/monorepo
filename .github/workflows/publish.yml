name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview what Nx will release based on conventional commits)'
        required: false
        default: false
        type: boolean
      first_release:
        description: 'First release (no prior git tags exist)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('**/nx.json', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Nx Report
        run: npx nx report

      # Dry run - preview only (Nx determines version from conventional commits)
      - name: Preview Release (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: |
          npx nx release \
            --dry-run \
            ${{ inputs.first_release == true && '--first-release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch
        if: ${{ inputs.dry_run == false }}
        run: git checkout -b release

      # Version, changelog, commit, and tag (on release branch)
      # Publishing is split into a separate step so that branch and tags
      # are pushed to the remote before packages are published to NPM.
      - name: Version and Changelog
        if: ${{ inputs.dry_run == false }}
        run: |
          npx nx release \
            --skip-publish \
            ${{ inputs.first_release == true && '--first-release' || '' }} \
            --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release branch and tags
        if: ${{ inputs.dry_run == false }}
        run: |
          git push -u origin release
          git push --tags

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          VERSION="${LATEST_TAG#v}"
          NOTES=$(sed -n "/^## ${VERSION}/,/^## [0-9]/p" CHANGELOG.md | sed '$d')

          gh release create "$LATEST_TAG" \
            --title "$LATEST_TAG" \
            --notes "$NOTES" \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        if: ${{ inputs.dry_run == false }}
        run: npx nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create PR to merge back to master
        if: ${{ inputs.dry_run == false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          VERSION="${LATEST_TAG#v}"

          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_CONTENT=$(sed -n "/^## ${VERSION}/,/^## [0-9]/p" CHANGELOG.md | sed '$d' || echo "See GitHub release for changes.")
          else
            CHANGELOG_CONTENT="See GitHub release for changes."
          fi

          gh pr create \
            --base master \
            --head release \
            --title "chore(release): merge v${VERSION} back to master" \
            --body "## Release v${VERSION}

          This PR merges the release branch back to master after publishing to NPM.

          ### Changelog
          ${CHANGELOG_CONTENT}

          ---
          *Auto-generated by the publish workflow*"
